<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: sans-serif;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(2rem, 12vw, 4rem);
      color: black;
      transition: color 0.4s ease;
      margin: 0;
      user-select: none;
    }

    h1.rainbow {
      animation: rainbow-shift 3s linear infinite;
      background: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet, red);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    @keyframes rainbow-shift {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    .controls {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
      z-index: 10;
    }

    label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.3rem;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 28px;
      height: 28px;
      cursor: pointer;
    }

    .gravity-panel {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: rgba(0, 0, 0, 0.05);
      padding: 12px 16px;
      border-radius: 10px;
      width: 100%;
      box-sizing: border-box;
    }

    .gravity-panel.visible {
      display: flex;
    }

    .gravity-panel label {
      font-size: 1rem;
      cursor: default;
    }

    .gravity-panel input[type="number"] {
      width: 70px;
      font-size: 1.1rem;
      padding: 4px 8px;
    }

    .gravity-panel input[type="range"] {
      width: 100%;
    }
  </style>
</head>
<body>
  <h1 id="greeting">Hello world!</h1>

  <div class="controls">
    <label>
      <input type="checkbox" id="colorToggle">
      Turn text blue
    </label>

    <label>
      <input type="checkbox" id="rainbowToggle">
      Rainbow mode
    </label>

    <label>
      <input type="checkbox" id="gravityToggle">
      Gravity mode
    </label>

    <div class="gravity-panel" id="gravityPanel">
      <label for="gravityStrength">Gravity strength (0-100):</label>
      <input type="range" id="gravityStrength" min="0" max="100" value="50">
      <input type="number" id="gravityStrengthNumber" min="0" max="100" value="50">
    </div>
  </div>

  <script>
    const greeting = document.getElementById('greeting');
    const colorToggle = document.getElementById('colorToggle');
    const rainbowToggle = document.getElementById('rainbowToggle');
    const gravityToggle = document.getElementById('gravityToggle');
    const gravityPanel = document.getElementById('gravityPanel');
    const gravitySlider = document.getElementById('gravityStrength');
    const gravityNumber = document.getElementById('gravityStrengthNumber');

    colorToggle.addEventListener('change', () => {
      if (rainbowToggle.checked) return;
      greeting.style.color = colorToggle.checked ? 'blue' : 'black';
    });

    rainbowToggle.addEventListener('change', () => {
      if (rainbowToggle.checked) {
        greeting.classList.add('rainbow');
        greeting.style.color = '';
      } else {
        greeting.classList.remove('rainbow');
        greeting.style.color = colorToggle.checked ? 'blue' : 'black';
      }
    });

    // Keep slider and number input in sync
    gravitySlider.addEventListener('input', () => {
      gravityNumber.value = gravitySlider.value;
    });
    gravityNumber.addEventListener('input', () => {
      let val = Math.min(100, Math.max(0, Number(gravityNumber.value) || 0));
      gravityNumber.value = val;
      gravitySlider.value = val;
    });

    // Physics simulation
    let velocity = 0;
    let posY = null;
    let animationId = null;
    const bounceDamping = 0.6;

    function startGravity() {
      const rect = greeting.getBoundingClientRect();
      posY = rect.top;
      greeting.style.top = `${posY}px`;
      greeting.style.transform = 'translateX(-50%)'; // keep horizontal centering, drop vertical centering
      velocity = 0;
      cancelAnimationFrame(animationId);
      animate();
    }

    function stopGravity() {
      cancelAnimationFrame(animationId);
      greeting.style.top = '40%';
      greeting.style.transform = 'translate(-50%, -50%)';
    }

    function animate() {
      const strength = Number(gravitySlider.value);
      const gravityAccel = strength / 100 * 0.6; // tune multiplier for realistic feel
      const floor = window.innerHeight - greeting.offsetHeight - 10;

      velocity += gravityAccel;
      posY += velocity;

      if (posY >= floor) {
        posY = floor;
        velocity *= -bounceDamping; // bounce back, losing some energy
        if (Math.abs(velocity) < 0.5) velocity = 0; // settle when bounce is tiny
      }

      greeting.style.top = `${posY}px`;
      animationId = requestAnimationFrame(animate);
    }

    gravityToggle.addEventListener('change', () => {
      if (gravityToggle.checked) {
        gravityPanel.classList.add('visible');
        startGravity();
      } else {
        gravityPanel.classList.remove('visible');
        stopGravity();
      }
    });

    // Re-trigger gravity fall if strength changes while active (optional nice touch)
    gravitySlider.addEventListener('change', () => {
      if (gravityToggle.checked && velocity === 0 && posY >= window.innerHeight - greeting.offsetHeight - 10) {
        // give it a little nudge so higher gravity feels responsive even when settled
        velocity = 1;
      }
    });
  </script>
</body>
</html>
