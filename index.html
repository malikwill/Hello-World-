<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: sans-serif;
      overflow: hidden;
      position: relative;
    }

    h1 {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(2rem, 12vw, 4rem);
      color: black;
      transition: color 0.4s ease;
      margin: 0;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    h1:active {
      cursor: grabbing;
    }

    h1.rainbow {
      animation: rainbow-shift 3s linear infinite;
      background: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet, red);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    @keyframes rainbow-shift {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    .controls {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 16px;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.2s ease;
      z-index: 10;
    }

    .controls.dimmed {
      opacity: 0.3;
      pointer-events: none;
    }

    label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.3rem;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 28px;
      height: 28px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1 id="greeting">Hello world!</h1>

  <div class="controls" id="controls">
    <label>
      <input type="checkbox" id="colorToggle">
      Turn text blue
    </label>

    <label>
      <input type="checkbox" id="rainbowToggle">
      Rainbow mode
    </label>
  </div>

  <script>
    const greeting = document.getElementById('greeting');
    const controls = document.getElementById('controls');
    const colorToggle = document.getElementById('colorToggle');
    const rainbowToggle = document.getElementById('rainbowToggle');

    colorToggle.addEventListener('change', () => {
      if (rainbowToggle.checked) return;
      greeting.style.color = colorToggle.checked ? 'blue' : 'black';
    });

    rainbowToggle.addEventListener('change', () => {
      if (rainbowToggle.checked) {
        greeting.classList.add('rainbow');
        greeting.style.color = '';
      } else {
        greeting.classList.remove('rainbow');
        greeting.style.color = colorToggle.checked ? 'blue' : 'black';
      }
    });

    // Drag functionality (mouse + touch)
    let isDragging = false;
    let offsetX = 0;
    let offsetY = 0;

    function startDrag(x, y) {
      isDragging = true;
      const rect = greeting.getBoundingClientRect();
      offsetX = x - rect.left;
      offsetY = y - rect.top;

      // Set left/top to current visual position BEFORE clearing transform,
      // so there's no jump when the centering transform is removed
      greeting.style.left = `${rect.left}px`;
      greeting.style.top = `${rect.top}px`;
      greeting.style.transform = 'none';

      controls.classList.add('dimmed');
    }

    function moveDrag(x, y) {
      if (!isDragging) return;
      greeting.style.left = `${x - offsetX}px`;
      greeting.style.top = `${y - offsetY}px`;
    }

    function endDrag() {
      isDragging = false;
      controls.classList.remove('dimmed');
    }

    // Mouse events
    greeting.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
    document.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
    document.addEventListener('mouseup', endDrag);

    // Touch events
    greeting.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      startDrag(touch.clientX, touch.clientY);
    });
    document.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      moveDrag(touch.clientX, touch.clientY);
    });
    document.addEventListener('touchend', endDrag);
  </script>
</body>
</html>
