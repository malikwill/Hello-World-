<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      font-size: clamp(2rem, 12vw, 4rem);
      color: black;
      transition: color 0.4s ease;
      margin-bottom: 30px;
    }

    h1.rainbow {
      animation: rainbow-shift 3s linear infinite;
      background: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet, red);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    @keyframes rainbow-shift {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.3rem;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 28px;
      height: 28px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1 id="greeting">Hello world!</h1>

  <div class="controls">
    <label>
      <input type="checkbox" id="colorToggle">
      Turn text blue
    </label>

    <label>
      <input type="checkbox" id="rainbowToggle">
      Rainbow mode
    </label>
  </div>

  <script>
    const greeting = document.getElementById('greeting');
    const colorToggle = document.getElementById('colorToggle');
    const rainbowToggle = document.getElementById('rainbowToggle');

    colorToggle.addEventListener('change', () => {
      if (rainbowToggle.checked) return; // rainbow takes priority
      greeting.style.color = colorToggle.checked ? 'blue' : 'black';
    });

    rainbowToggle.addEventListener('change', () => {
      if (rainbowToggle.checked) {
        greeting.classList.add('rainbow');
        greeting.style.color = ''; // let the gradient take over
      } else {
        greeting.classList.remove('rainbow');
        // restore whatever the blue toggle says
        greeting.style.color = colorToggle.checked ? 'blue' : 'black';
      }
    });
  </script>
</body>
</html>
